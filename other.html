  for(let i=0;i<ser.length;i+=6)g+=`<text class="ax" x="${cxp(i)}" y="${CH.H-10}" text-anchor="middle">${mlabel(ser[i])}</text>`;

function heroIntro(d=0){if(!hasG||RM)return;gsap.timeline({defaults:{ease:'power4.out'},delay:d})
  .to('#home .hk',{opacity:1,y:0,duration:.7},.05).to('#home .ttl .l>span',{yPercent:0,rotate:0,duration:1.2,stagger:.1},.1)
  .to('#role',{opacity:1,y:0,duration:.8,ease:'back.out(2)'},.55).to('#home .hd',{opacity:1,y:0,duration:.85,stagger:.1},.62)
  .to('.viz',{opacity:1,y:0,scale:1,duration:1.2,ease:'back.out(1.5)'},.5).to('#home .orb',{opacity:1,duration:1.6},.4)}
function initScroll(){
  $$('.cnt').forEach(c=>{const v=+c.dataset.v,o={n:0},fin=()=>{c.dataset.done=1;c.textContent=cnt(c,v)};
    if(!hasG||RM)return fin();ScrollTrigger.create({trigger:c,start:'top 92%',once:true,onEnter:()=>gsap.to(o,{n:v,duration:1.6,ease:'power2.out',onUpdate:()=>c.textContent=cnt(c,Math.round(o.n)),onComplete:fin})})});
  $$('.sf').forEach(b=>{if(!hasG||RM)return b.style.width=b.dataset.w+'%';ScrollTrigger.create({trigger:b,start:'top 94%',once:true,onEnter:()=>gsap.to(b,{width:b.dataset.w+'%',duration:1.5,ease:'power3.out'})})});
  $$('.rf').forEach((c,i)=>{const off=CI[i]*(1-c.dataset.p/100);if(!hasG||RM)return c.setAttribute('stroke-dashoffset',off);ScrollTrigger.create({trigger:'#rings',start:'top 85%',once:true,onEnter:()=>gsap.to(c,{attr:{'stroke-dashoffset':off},duration:1.8,delay:i*.18,ease:'power3.out'})})});
  if(!hasG||RM){drawn=true;return}
  ScrollTrigger.create({trigger:'#cs',start:'top 85%',once:true,onEnter:()=>{drawn=true;const L=$('#cL');gsap.to(L,{strokeDashoffset:0,duration:2.2,ease:'power2.inOut'});gsap.to('#cA',{opacity:1,duration:1.4,delay:1,ease:'power2.out'});gsap.to('#cD,.pc',{opacity:1,duration:.7,delay:1.8})}});
  $$('[data-r]').forEach(el=>gsap.from(el,{y:46,opacity:0,duration:1.05,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%',once:true}}));
  $$('.ttl').filter(x=>!x.closest('#home')).forEach(x=>gsap.from(x.querySelectorAll('.l>span'),{yPercent:118,rotate:5,duration:1.15,ease:'power4.out',stagger:.09,scrollTrigger:{trigger:x,start:'top 88%',once:true}}));
  $$('[data-st]').forEach(g=>gsap.from(g.children,{scale:.82,opacity:0,duration:.7,ease:'back.out(1.9)',stagger:.08,scrollTrigger:{trigger:g,start:'top 92%',once:true}}));
  ScrollTrigger.batch('#stats .card,.sk',{start:'top 94%',once:true,onEnter:b=>gsap.from(b,{y:42,opacity:0,scale:.965,duration:.9,ease:'power3.out',stagger:.07,clearProps:'scale'})});
  ScrollTrigger.config({ignoreMobileResize:true});
  gsap.matchMedia().add('(min-width:1024px) and (pointer:fine)',()=>{
    gsap.utils.toArray('.ttl').filter(x=>!x.closest('#home')).forEach(x=>gsap.fromTo(x,{y:12},{y:-18,ease:'none',scrollTrigger:{trigger:x,start:'top 94%',end:'top 30%',scrub:1}}));
    gsap.fromTo('#cwrap',{y:16},{y:-16,ease:'none',scrollTrigger:{trigger:'#chartCard',start:'top bottom',end:'bottom top',scrub:1.4}});
    gsap.to('#contact .orb',{y:90,ease:'none',scrollTrigger:{trigger:'#contact',start:'top bottom',end:'bottom top',scrub:1.2}})});
  addEventListener('load',()=>ScrollTrigger.refresh());document.fonts&&document.fonts.ready.then(()=>ScrollTrigger.refresh())}

/* ================= boot ================= */
apply();chart();heroSets();initScroll();
(async()=>{
  if(document.documentElement.classList.contains('bi')){try{sessionStorage.removeItem('cs_bolt')}catch(e){}
    if(hasG&&!RM){gsap.to('#flash',{opacity:0,duration:1.1,ease:'power2.out'});heroIntro(.1)}else $('#flash').style.opacity=0;return}
  if(hasG&&!RM)gsap.to('#preB',{width:'100%',duration:1.2,ease:'power2.inOut'});else $('#preB').style.width='100%';
  await Promise.race([Promise.all([new Promise(r=>setTimeout(r,RM?60:1300)),document.fonts?document.fonts.ready:0]),new Promise(r=>setTimeout(r,3000))]);
  if(hasG&&!RM)gsap.timeline().to('#pre>div',{y:-26,opacity:0,duration:.5,ease:'power3.in'}).to('#pre',{clipPath:'inset(0 0 100% 0)',duration:.95,ease:'power4.inOut'},'-=.1').set('#pre',{display:'none'}).add(()=>heroIntro(),'-=.55');
  else $('#pre').style.display='none'})();
</script>
</body>
</html>
