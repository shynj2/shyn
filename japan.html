<script>
(function(){
const main=document.querySelector("main"),root=document.getElementById("world3d"),cam3=document.getElementById("cam3d"),closeBtn=document.getElementById("zoom-close");
const API=window.__SIGNS={K:100,target:null,list:[],dim:null};
/* [section id, z along the road, side: -1 = left of the road, 1 = right] */
/* [id, board z, side, unlockZ = must pass this gate (camera z < unlockZ) before the board opens] */
/* gates sit at -21,-42,-63,-84,-105,-126,-147 */
const CFG=[
  ["about",-33.5,-1,-21],
  ["resume",-54.5,1,-42],
  ["tools",-96.5,-1,-84],
  ["journey",-117.5,1,-105],
  ["works",-136.5,-1,-126],
  ["contact",-145.5,1,-136]
];
CFG.forEach(c=>{
  const sec=document.getElementById(c[0]),panel=sec&&sec.querySelector(".panel");if(!panel)return;
  const el=document.createElement("div");el.className="sign";el.id="sign-"+c[0];el.tabIndex=0;el.setAttribute("role","button");
  const body=document.createElement("div");body.className="body";while(panel.firstChild)body.appendChild(panel.firstChild);
  const tap=document.createElement("div");tap.className="tap";tap.setAttribute("data-t","tap");
  panel.appendChild(body);panel.appendChild(tap);el.appendChild(panel);cam3.appendChild(el);
  API.list.push({id:c[0],zc:c[1],side:c[2],unlock:c[3],el,panel,body,ph:300,hidden:true,opened:false});
});

function dims(){const nar=innerWidth/innerHeight<1;
  /* XC = distance from road center
     W  = world width of the board (keep proportions so the scroll looks right)
     hcap = max pixel height of the scroll body when NOT focused */
  return nar?{nar,pw:340,W:4.0,XC:4.6,yaw:28*Math.PI/180,hcap:Math.max(260,Math.round(Math.min(420,innerHeight*.55)))}
            :{nar,pw:480,W:4.8,XC:5.8,yaw:22*Math.PI/180,hcap:Math.max(280,Math.round(Math.min(480,innerHeight*.58)))}}



function sizes(){API.list.forEach(s=>{
  s.ph=s.el.offsetHeight||s.ph;
  s.body.classList.toggle("more",s.body.scrollHeight>s.body.clientHeight+2);
})}


function measure(){const d=API.dim=dims();root.style.setProperty("--pw",d.pw+"px");root.style.setProperty("--hcap",d.hcap+"px");sizes()}
function layout(){if(document.body.classList.contains("no3d"))return;const vh=innerHeight,ft=document.querySelector("footer"),fh=ft?ft.offsetHeight:0;main.style.height=(13*vh+vh-fh)+"px"}
function all(){layout();measure()}
if("ResizeObserver"in window){const ro=new ResizeObserver(sizes);API.list.forEach(s=>ro.observe(s.el))}
const ap=apply;apply=function(){ap();all()};
apply();addEventListener("resize",all);addEventListener("load",all);document.fonts&&document.fonts.ready.then(all);
API.noWebGL=()=>{main.style.height="auto";API.list.forEach(s=>s.panel.classList.add("in"));API.target=null};

/* ---- click a sign -> camera flies to it; click outside / x / Esc -> back to the road ---- */
function enter(s){if(API.target)return;s.panel.classList.add("in");API.target=s;s.el.classList.add("focused");document.body.classList.add("zoom-focus");s.body.scrollTop=0}
function exit(){const s=API.target;if(!s)return;API.target=null;s.el.classList.remove("focused");document.body.classList.remove("zoom-focus");s.body.scrollTop=0}
API.enter=enter;API.exit=exit;
API.list.forEach(s=>{
  /* capture phase: in road mode even a click on a link only zooms in; links work once the sign is focused */
  s.el.addEventListener("click",e=>{if(API.target===s||document.body.classList.contains("no3d")||!s.opened)return;e.preventDefault();enter(s)},true);
  s.el.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!API.target&&s.opened&&e.target===s.el){e.preventDefault();enter(s)}});
});

closeBtn.addEventListener("click",e=>{e.stopPropagation();exit()});
addEventListener("click",e=>{if(API.target&&!e.target.closest(".sign.focused"))exit()});
addEventListener("keydown",e=>{const s=API.target;if(!s)return;
  if(e.key==="Escape"){exit();return}
  const k={ArrowDown:1,ArrowUp:-1,PageDown:8,PageUp:-8,End:99,Home:-99," ":e.shiftKey?-8:8}[e.key];
  if(k){e.preventDefault();const b=s.body;b.scrollBy({top:Math.abs(k)===99?k*1e4:(Math.abs(k)>=8?b.clientHeight*.85*Math.sign(k):k*60),behavior:"smooth"})}});
/* while a sign is open the page must not scroll, but the sign's own text must */
function guard(e){const s=API.target;if(!s)return;const b=s.body;if(b.contains(e.target)&&b.scrollHeight>b.clientHeight+1)return;e.preventDefault()}
addEventListener("wheel",guard,{passive:false});addEventListener("touchmove",guard,{passive:false});
})();
</script>
