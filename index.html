<style>
:root{--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1);
--bg:#0A0A0E;--surface:#111117;--s1:#17171F;--s2:#1F1F29;--s3:#282836;--ink:#F4F4F9;--ink2:#A9A9B6;--ink3:#6E6E7E;

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}

.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.c2{color:var(--ink2)}.c3{color:var(--ink3)}
.outl{color:transparent;-webkit-text-stroke:1.5px rgba(244,244,249,.3)}
.l{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.16em;margin-bottom:-.16em}
.l>span{display:inline-block}
.ltr{direction:ltr;unicode-bidi:isolate}
#noise{position:fixed;inset:-50%;z-index:70;pointer-events:none;opacity:.05;animation:grain 9s steps(6) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-4%)}60%{transform:translate(-3%,-2%)}80%{transform:translate(4%,4%)}}
#cur{position:fixed;top:0;left:0;z-index:90;width:34px;height:34px;border-radius:99px;border:1.5px solid rgba(244,244,249,.45);pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:width .35s var(--ease-spring),height .35s var(--ease-spring),opacity .3s}
#cur.on{opacity:1}#cur.big{width:58px;height:58px;border-color:var(--ink)}
#cur i{position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:99px;background:var(--ink);transform:translate(-50%,-50%)}
@media(pointer:coarse){#cur{display:none}}
#pre{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;clip-path:inset(0)}
.bi #pre{display:none}
#preT{width:180px;height:4px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:22px}
#preB{height:100%;width:0;background:var(--ink)}
#flash{position:fixed;inset:0;z-index:150;background:#fff;opacity:0;pointer-events:none}
.bi #flash{opacity:1}
#pbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none}
#pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ink3),var(--ink));transform:scaleX(0);transform-origin:left}
html[dir=rtl] #pbar i{transform-origin:right}
.blob{border-radius:42% 58% 63% 37%/43% 39% 61% 57%;animation:morph 14s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/43% 39% 61% 57%}33%{border-radius:58% 42% 37% 63%/61% 56% 44% 39%}66%{border-radius:37% 63% 56% 44%/52% 37% 63% 48%}}
.spin{animation:spin 26s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:floaty 7s ease-in-out infinite}.float2{animation:floaty 9s ease-in-out infinite reverse}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;position:relative;background:#42D77D}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:99px;background:#42D77D;opacity:.35;animation:ping 1.8s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.5}80%,100%{transform:scale(1.9);opacity:0}}
.orb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 35%,var(--glow),transparent 65%)}
.grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 80% 65% at 50% 40%,#000 20%,transparent 75%)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:20px;font:700 15.5px inherit;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:transform .5s var(--ease-spring),border-radius .5s var(--ease-spring),box-shadow .45s,background .3s}
.btn:hover{transform:translateY(-2px);border-radius:28px}.btn:active{transform:scale(.965);border-radius:14px}
.fill{background:var(--ink);color:var(--bg)}.fill:hover{box-shadow:0 18px 40px -16px rgba(244,244,249,.45)}
.out{background:transparent;color:var(--ink);border-color:var(--line2)}.out:hover{background:var(--glow)}
.rip{position:absolute;border-radius:99px;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none;transition:transform .6s var(--ease-out),opacity .8s}.rip.go{transform:scale(1);opacity:0}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:transform .35s var(--ease-spring)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;transition:transform .55s var(--ease-spring),border-color .4s,box-shadow .5s,border-radius .55s var(--ease-spring)}
.hov:hover{transform:translateY(-7px);border-color:var(--line2);box-shadow:var(--shadow);border-radius:34px 34px 22px 34px}
.tag{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s1);border:1px solid var(--line);color:var(--ink2);width:max-content}
.tag i{width:6px;height:6px;border-radius:99px;background:var(--ink)}
.mq{direction:ltr;overflow:hidden;border-block:1px solid var(--line);padding:22px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-t{display:flex;gap:14px;width:max-content;animation:mq 30s linear infinite}.mq:hover .mq-t{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mqi{padding:12px 22px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:700;font-size:14px;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.sf{height:100%;width:0;border-radius:99px;background:var(--ink);position:relative}
.sf::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(10,10,14,.35) 50%,transparent 75%);background-size:200% 100%;animation:sh 2.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
section{padding:110px 0;scroll-margin-top:80px}
h2{font-size:clamp(34px,5.4vw,60px);line-height:1.2;margin:18px 0 44px}
.g2{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dur{font-size:12px;font-weight:700;border:1px solid var(--line2);border-radius:99px;padding:2px 10px;color:var(--ink2)}
.chk{list-style:none;padding:0;display:grid;gap:6px;margin-top:6px}
header{position:fixed;top:0;left:0;right:0;z-index:40;border-bottom:1px solid transparent;transition:.4s}
header.sc{background:var(--glass);backdrop-filter:blur(18px);border-color:var(--line)}
header .wrap{height:66px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px 0 14px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink);background:linear-gradient(120deg,var(--s2),var(--s1));border:1px solid var(--line2);cursor:pointer;font-family:inherit;transition:all .5s var(--ease-spring)}
html[dir=rtl] .back{padding:0 14px 0 18px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease-spring)}

.back:hover{background:var(--ink);color:var(--bg);border-radius:14px;transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(244,244,249,.5)}
.back:hover svg{transform:translateX(-5px)}html[dir=rtl] .back:hover svg{transform:scaleX(-1) translateX(-5px)}
.lang{height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:700 13px inherit;font-family:Vazirmatn,Inter,sans-serif;cursor:pointer;transition:all .4s var(--ease-spring)}
.lang:hover{background:var(--s2);border-radius:14px}
@media(max-width:700px){.back span,.hr .pill{display:none}.back{padding:0 12px}}
.rail{position:fixed;z-index:40;display:flex;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:var(--shadow);inset-inline:0;bottom:0;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));border-width:1px 0 0}
.rail a{position:relative;flex:1;display:grid;place-items:center;padding:11px 0;border-radius:18px;color:var(--ink3);font-size:11px;font-weight:700;transition:color .3s}

.rail a span{position:relative}.rail a.on{color:var(--ink)}.rail a.on::before{background:var(--s3);transform:none}
body{padding-bottom:64px}

.rail{inset-inline:auto;inset-inline-start:14px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:4px;padding:10px 8px;border-radius:99px;border-width:1px}.rail a{width:62px;flex:none}}
#fab{position:fixed;inset-inline-end:18px;bottom:84px;z-index:45;width:54px;height:54px;border-radius:19px;display:grid;place-items:center;background:var(--s2);color:var(--ink);border:1px solid var(--line2);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(18px) scale(.85);transition:all .5s var(--ease-spring);box-shadow:var(--shadow)}
#fab.show{opacity:1;pointer-events:auto;transform:none}#fab:hover{border-radius:26px;transform:translateY(-3px)}

.cw{position:relative;direction:ltr}.cw svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--ink3);font-size:11px;font-weight:600;font-family:Inter,Vazirmatn}
.pc{animation:pc 2.4s var(--ease-out) infinite;transform-origin:center;transform-box:fill-box}
@keyframes pc{0%{opacity:.5;transform:scale(.6)}70%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
#ctip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 13px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .25s,left .18s var(--ease-out),top .18s var(--ease-out)}
#ctip.on{opacity:1}
.rg{width:100%;max-width:210px;transform:rotate(-90deg)}

#cur{width:40px;height:40px;border:1.5px solid rgba(244,244,249,.55);mix-blend-mode:difference;transition:width .4s var(--ease-spring),height .4s var(--ease-spring),opacity .3s,background .3s,border-color .3s,transform .25s var(--ease-out)}

@media(pointer:fine){html.hc,html.hc *{cursor:none!important}}

/* ===== icons / skills ===== */
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none;visibility:hidden}

.wkg{display:grid;gap:22px;grid-template-columns:1fr}

@media(min-width:1000px){.wkg{grid-template-columns:repeat(6,1fr)}.pw.w2{grid-column:span 2}.pw.w3{grid-column:span 3}.pw.w4{grid-column:span 4;grid-template-columns:1fr 1fr;grid-template-rows:none}

/* ===== no-GSAP fallback ===== */
@keyframes rIn{from{opacity:0;transform:translateY(42px)}}
@keyframes rise{from{transform:translateY(118%) rotate(5deg)}}
.rv0:not(.ttl){opacity:0}.rv0 .l>span{transform:translateY(118%)}

/* ===== hero v2: mobile-safe (single column, minmax(0,1fr), photo card first on phones) ===== */

.hero{position:relative;overflow:hidden;min-height:100svh;display:grid;align-items:center;padding:112px 0 80px}

/* ================= scroll animations ================= */
function heroSets(){if(!hasG||RM)return;gsap.set('#home .hk',{opacity:0,y:18});gsap.set('#home .ttl .l>span',{yPercent:118,rotate:5});gsap.set('#role',{opacity:0,y:14});gsap.set('#home .hd',{opacity:0,y:20});gsap.set('.viz',{opacity:0,y:44,scale:.94});gsap.set('#home .orb',{opacity:0})}
function heroIntro(d=0){if(!hasG||RM)return;gsap.timeline({defaults:{ease:'power4.out'},delay:d})
  .to('#home .hk',{opacity:1,y:0,duration:.7},.05).to('#home .ttl .l>span',{yPercent:0,rotate:0,duration:1.2,stagger:.1},.1)
  .to('#role',{opacity:1,y:0,duration:.8,ease:'back.out(2)'},.55).to('#home .hd',{opacity:1,y:0,duration:.85,stagger:.1},.62)
  .to('.viz',{opacity:1,y:0,scale:1,duration:1.2,ease:'back.out(1.5)'},.5).to('#home .orb',{opacity:1,duration:1.6},.4)}
function fbChart(){const L=$('#cL');if(!L)return;const len=L.getTotalLength();L.style.strokeDasharray=len;L.style.strokeDashoffset=len;L.style.transition='stroke-dashoffset 2.2s ease-in-out';
  const A=$('#cA');A.style.opacity=0;A.style.transition='opacity 1.4s 1s';$$('#cD,.pc').forEach(e=>{e.style.visibility='hidden'})}
function fallback(){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const e=en.target;io.unobserve(e);if(e._cls){e.classList.remove('rv0');e.classList.add('rv1')}e._go&&e._go()}),{rootMargin:'0px 0px -6% 0px'});
  const reg=(e,go,cls)=>{e._go=go;e._cls=cls;if(cls)e.classList.add('rv0');io.observe(e)};
  $$('#home .ttl .l>span').forEach((x,i)=>x.style.animationDelay=(.1+i*.1)+'s');
  $$('[data-r],#stats .card,.sk').forEach(e=>reg(e,0,1));
  $$('.ttl').filter(x=>!x.closest('#home')).forEach(x=>{x.querySelectorAll('.l>span').forEach((y,i)=>y.style.animationDelay=i*.09+'s');reg(x,0,1)});
  $$('.cnt').forEach(c=>{const v=+c.dataset.v;reg(c,()=>{const t0=performance.now(),st=n=>{const k=Math.min(1,(n-t0)/1600);c.textContent=cnt(c,Math.round(v*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(st);else{c.dataset.done=1;c.textContent=cnt(c,v)}};requestAnimationFrame(st)})});
  $$('.sf').forEach(b=>reg(b,()=>{b.style.width=b.dataset.w+'%'}));
  $$('.rf').forEach((c,i)=>reg(c,()=>setTimeout(()=>c.setAttribute('stroke-dashoffset',CI[i]*(1-c.dataset.p/100)),i*180)));
  reg($('#cs'),()=>{drawn=true;$('#cL').style.strokeDashoffset=0;$('#cA').style.opacity=1;setTimeout(()=>$$('#cD,.pc').forEach(e=>{e.style.visibility='visible'}),1800)})}
function initScroll(){
  if(!hasG&&!RM){fallback();return}
  $$('.cnt').forEach(c=>{const v=+c.dataset.v,o={n:0},fin=()=>{c.dataset.done=1;c.textContent=cnt(c,v)};
    if(!hasG||RM)return fin();ScrollTrigger.create({trigger:c,start:'top 92%',once:true,onEnter:()=>gsap.to(o,{n:v,duration:1.6,ease:'power2.out',onUpdate:()=>c.textContent=cnt(c,Math.round(o.n)),onComplete:fin})})});
  $$('.sf').forEach(b=>{if(!hasG||RM)return b.style.width=b.dataset.w+'%';ScrollTrigger.create({trigger:b,start:'top 94%',once:true,onEnter:()=>gsap.to(b,{width:b.dataset.w+'%',duration:1.5,ease:'power3.out'})})});
  $$('.rf').forEach((c,i)=>{const off=CI[i]*(1-c.dataset.p/100);if(!hasG||RM)return c.setAttribute('stroke-dashoffset',off);ScrollTrigger.create({trigger:'#rings',start:'top 85%',once:true,onEnter:()=>gsap.to(c,{attr:{'stroke-dashoffset':off},duration:1.8,delay:i*.18,ease:'power3.out'})})});
  if(!hasG||RM){drawn=true;return}
  ScrollTrigger.create({trigger:'#cs',start:'top 85%',once:true,onEnter:()=>{drawn=true;const L=$('#cL');gsap.to(L,{strokeDashoffset:0,duration:2.2,ease:'power2.inOut'});gsap.to('#cA',{opacity:1,duration:1.4,delay:1,ease:'power2.out'});gsap.to('#cD,.pc',{opacity:1,duration:.7,delay:1.8})}});
  $$('[data-r]').forEach(el=>gsap.from(el,{y:46,opacity:0,duration:1.05,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%',once:true}}));
  $$('.ttl').filter(x=>!x.closest('#home')).forEach(x=>gsap.from(x.querySelectorAll('.l>span'),{yPercent:118,rotate:5,duration:1.15,ease:'power4.out',stagger:.09,scrollTrigger:{trigger:x,start:'top 88%',once:true}}));
  $$('[data-st]').forEach(g=>gsap.from(g.children,{scale:.82,opacity:0,duration:.7,ease:'back.out(1.9)',stagger:.08,scrollTrigger:{trigger:g,start:'top 92%',once:true}}));
  ScrollTrigger.batch('#stats .card,.sk',{start:'top 94%',once:true,onEnter:b=>gsap.from(b,{y:42,opacity:0,scale:.965,duration:.9,ease:'power3.out',stagger:.07,clearProps:'scale'})});
  ScrollTrigger.config({ignoreMobileResize:true});
  gsap.matchMedia().add('(min-width:1024px) and (pointer:fine)',()=>{
    gsap.utils.toArray('.ttl').filter(x=>!x.closest('#home')).forEach(x=>gsap.fromTo(x,{y:12},{y:-18,ease:'none',scrollTrigger:{trigger:x,start:'top 94%',end:'top 30%',scrub:1}}));
    gsap.fromTo('#cwrap',{y:16},{y:-16,ease:'none',scrollTrigger:{trigger:'#chartCard',start:'top bottom',end:'bottom top',scrub:1.4}});
    gsap.to('#contact .orb',{y:90,ease:'none',scrollTrigger:{trigger:'#contact',start:'top bottom',end:'bottom top',scrub:1.2}})});
  addEventListener('load',()=>ScrollTrigger.refresh());document.fonts&&document.fonts.ready.then(()=>ScrollTrigger.refresh())}


/* ================= works filter ================= */
const WCAT=['all','store','corp'];
$('#fl').innerHTML=WCAT.map((c,i)=>`<button class="fch" type="button" data-f="${c}" aria-pressed="${i===0}"><span data-i="c_${c}"></span><small>${c==='all'?WK.length:WK.filter(w=>w[4]===c).length}</small></button>`).join('');
function spans(n){const a=[];let i=0;while(i<n){const l=n-i;if(l===1){a.push(6);i++}else if(l===2||l===4){for(let j=0;j<l;j++)a.push(3);i+=l}else{a.push(2,2,2);i+=3}}return a}
function wkFilter(f){const cards=$$('#wk .pw'),vis=cards.filter(c=>f==='all'||c.dataset.cat===f);
  cards.forEach(c=>{c.hidden=!vis.includes(c)});$('#wk').classList.toggle('flt',f!=='all');
  const sp=spans(vis.length);cards.forEach(c=>c.style.removeProperty('--sp'));if(f!=='all')vis.forEach((c,i)=>c.style.setProperty('--sp',sp[i]));
  $$('#fl .fch').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  if(hasG&&!RM){vis.forEach(c=>gsap.killTweensOf(c));gsap.fromTo(vis,{y:28,opacity:0},{y:0,opacity:1,duration:.7,ease:'power3.out',stagger:.07,clearProps:'opacity'});window.ScrollTrigger&&ScrollTrigger.refresh()}
  else vis.forEach((c,i)=>{c.classList.remove('rv0');c.style.animation='none';void c.offsetWidth;c.style.animation=`rIn .7s ${i*.06}s var(--ease-out) backwards`})}
$('#fl').addEventListener('click',e=>{const b=e.target.closest('.fch');if(b)wkFilter(b.dataset.f)});

/* ================= A4 resume ================= */
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function a4path(P){let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}return d}
function a4html(){
  const nm=t('name2').split('|'),pct=v=>nf(v)+(lang==='fa'?'٪':'%');
  const jobs=[1,2,3].map(k=>`<div class="a4j"><b>${esc(t('job'+k+'_t'))}</b><div class="m"><span>${esc(t('job'+k+'_d'))}</span><em>${esc(dur(k))}</em></div>${t('job'+k+'_r').split('|').map(r=>`<div class="r">— ${esc(r)}</div>`).join('')}</div>`).join('');
  const works=WK.map((w,i)=>`<div><b>${w[0]}</b><small>${esc(t('p'+(i+1)+'t'))}</small></div>`).join('');
  const sk=SK.map(x=>`<div><div class="t"><span>${esc(t(x[1]))}</span><span>${pct(x[3])}</span></div><div class="b"><i style="width:${x[3]}%"></i></div></div>`).join('');
  const st=[[4,'+','st1'],[3,'','st2'],[6,'','st3'],[3,'','st4']].map(x=>`<div><b>${nf(x[0])}${x[1]}</b><small>${esc(t(x[2]))}</small></div>`).join('');
  const P=sm.map((v,i)=>[i/(sm.length-1)*400,40-v/8*34]),d=a4path(P),e=P[P.length-1];
  const chart=`<svg viewBox="0 0 400 44"><defs><linearGradient id="a4g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F9" stop-opacity=".22"/><stop offset="1" stop-color="#F4F4F9" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="400" y1="40" y2="40" stroke="rgba(255,255,255,.1)"/><path d="${d}L400 40L0 40Z" fill="url(#a4g)"/><path d="${d}" fill="none" stroke="#F4F4F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.6" fill="#0A0A0E" stroke="#F4F4F9" stroke-width="2"/></svg>`;
  return `<div class="a4s" dir="${lang==='fa'?'rtl':'ltr'}" lang="${lang}">
<div class="a4h"><div><span class="a4tag"><i></i>${esc(t('a4_pill'))}</span><h1><span>${esc(nm[0])}</span> <span class="o">${esc(nm[1])}</span></h1><div class="a4r"><u></u><span>${esc(t('roles').split('|').join(' · '))}</span></div><div class="a4ct"><span>shynj2@gmail.com</span><span>t.me/shynj2</span><span>09229513128</span></div></div><div class="a4ph"><img src="assets/img/shayan.jpg" alt=""></div></div>
<div class="a4g"><div class="a4col">
<div class="a4c"><div class="a4k"><i></i>${esc(t('n_about'))}</div><p>${esc(t('about'))}</p></div>
<div class="a4c"><div class="a4k"><i></i>${esc(t('exp_h'))}</div>${jobs}</div>
<div class="a4c a4ch"><div class="a4k"><i></i>${esc(t('chart_h'))}</div>${chart}<div class="ax"><span>${esc(mlabel(ser[0]))}</span><span>${esc(mlabel(ser[ser.length-1]))}</span></div></div>
<div class="a4c"><div class="a4k"><i></i>${esc(t('n_works'))}</div><div class="a4w">${works}</div></div>
</div><div class="a4col">
<div class="a4st">${st}</div>
<div class="a4c a4sk"><div class="a4k"><i></i>${esc(t('n_skills'))}</div>${sk}</div>
<div class="a4c"><div class="a4k"><i></i>${esc(t('lang_h'))}</div><div class="a4pl">${['l1','l2','l3'].map(k=>`<span>${esc(t(k))}</span>`).join('')}</div></div>
<div class="a4c"><div class="a4k"><i></i>${esc(t('verse_h'))}</div><div class="a4pl">${t('verse').split(' · ').map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>
</div></div>
<div class="a4f"><span>${esc(t('footer'))}</span><span class="ltr">shynj2@gmail.com</span></div></div>`}
const A4m=$('#a4m'),A4s=$('#a4scale'),A4st=$('#a4stage'),A4p=$('#a4print');let a4op=null;
function a4fit(){const s=$('.a4s',A4s);if(!s||A4m.hidden)return;const w=s.offsetWidth,h=s.offsetHeight,k=Math.min(1,(A4st.clientWidth-8)/w);A4s.style.transform=`scale(${k})`;A4s.style.width=w+'px';A4s.style.marginBottom=-(h*(1-k))+'px'}
function a4render(){if(!A4m.hidden){A4s.innerHTML=a4html();a4fit()}}
function a4open(e){a4op=e&&e.currentTarget;A4m.hidden=false;document.body.classList.add('lock');A4s.innerHTML=a4html();$$('[data-i]',A4m).forEach(x=>x.textContent=t(x.dataset.i));a4fit();$('#a4p').focus({preventScroll:true})}
function a4close(){if(A4m.hidden)return;A4m.hidden=true;document.body.classList.remove('lock');A4s.innerHTML='';a4op&&a4op.focus&&a4op.focus({preventScroll:true})}
['#a4o','#a4b'].forEach(q=>$(q).addEventListener('click',a4open));
$('#a4p').addEventListener('click',()=>{A4p.innerHTML=a4html();document.fonts&&document.fonts.ready?document.fonts.ready.then(()=>window.print()):window.print()});
$('#a4x').addEventListener('click',a4close);
addEventListener('keydown',e=>{if(e.key==='Escape')a4close()});
addEventListener('resize',a4fit);addEventListener('afterprint',()=>{A4p.innerHTML=''});

try{document.fonts.load("24px 'Material Symbols Rounded'",'search').then(f=>{if(f&&f.length)document.documentElement.classList.add('mi')})}catch(e){}
if(!hasG&&!RM)document.documentElement.classList.add('nogsap');

(async()=>{

  else $('#pre').style.display='none'})();
